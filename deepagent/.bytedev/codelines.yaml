IgnoreRules: # 需要忽略不计入代码行统计的文件识别规则
    IgnoreAll: true # 忽略所有代码，不统计该仓库，默认 false
    FilePathPattern: # 正则表达式数组，文件路径命中任意一行规则即被视为忽略文件
        - (^|/)agentworker(/|$)
        - (^|/)cloudagent(/|$)
        - (^|/)cmd(/|$)
        - (^|/)deepagents(/|$)
        - (^|/)docker(/|$)
        - (^|/)go\.mod$
        - (^|/)go\.sum$
        - (^|/)metrics(/|$)   
        - (^|/)mock(/|$)
        - (^|/)skills(/|$)
    FileContentPattern: # 正则表达式数组，文件头部前 10 行（最大 8000 字节）命中任意一行规则即被视为忽略文件
        - ^(?:[^\/]|\/[^\*])*\/\*(?:[^\*]|\*[^\/])*Generated by PEG.js
        - "^// Test code by cyx\\."
ExceptionRules: # 例外规则
    LargeCommits: # 需要豁免的超大 commit id，这里填 MR 的 Merge Commit 是没有意义的，要找到 MR 的非 Merge Commit 的 SHA
        
