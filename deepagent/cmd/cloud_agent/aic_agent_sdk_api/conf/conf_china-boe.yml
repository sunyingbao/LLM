auth:
  mode: online

coordinator:
  namespace: cloud_agent
  psm: ad.creative.aic_agent_coordinator
  cluster: dreamina
  direct_hostports: ""

aic_agent_sdk_session:
  psm: ad.creative.aic_agent_sdk_session
  cluster: ""
  direct_hostports: ""

workspace:
  root: /workspace

backend:
  type: ai_infra
  ai_infra:
    psm: pippit.sandbox.gateway
    biz_type: test
    biz_id_template: "user_{uid}"
    workdir_template: "/workspace/{project_name}"
    action: SandboxToolCall

timeline:
  default_limit: 50
  max_limit: 200
