base_prompt: conf/prompt/base.md

worker:
  namespace: cloud_agent
  concurrency: 8
  scan_limit: 20
  message_limit: 50
  lease_ms: 60000
  scan_interval_ms: 1000
  message_poll_interval_ms: 500
  idle_timeout_ms: 10000
  shutdown_drain_timeout_ms: 120000
  shutdown_interrupt_drain_timeout_ms: 120000
  interrupt_drain_timeout_ms: 30000

coordinator:
  psm: ad.creative.aic_agent_coordinator
  direct_hostports: 127.0.0.1:8888

mysql:
  psm: ""
  db_name: agent_coordinator_test
  dsn: ${AGENT_WORKER_MYSQL_DSN}
  read_dsn: ""
  read_timeout_ms: 5000

abase:
  psm: ""
  primary_psm: ""
  master_prefer: ""
  table: ""
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  read_timeout_ms: 500
  write_timeout_ms: 500

tables:
  history: t_agentthread_history
  thread_ref: t_agent_thread_ref

checkpoint:
  store: redis://cloud_agent

models:
  default:
    sdk_type: openai
    model_name: experimental_0630
    model_base_url: ${OPENAI_BASE_URL}
    model_api_key: ${DEEPSEEK_API_KEY}
    model_endpoint_id: ${OPENAI_MODEL}
    max_tokens: 32768
    disable_by_azure: true

roles:
  main:
    models: [default]
    default_model: default
    approval_policy: normal
  explorer:
    models: [default]
    default_model: default
    approval_policy: readonly
  worker:
    models: [default]
    default_model: default
    approval_policy: permissive

runtime:
  workdir: ../runtime/dev/workdirs
  skills_dir: ../runtime/skills
  spawn_metadata_description: ""
  auto_compact_limit_tokens: 0
  compact_kept_user_tokens: 4000
  max_steps: 0
  compact_prompt_append: |-
    Additional CloudAgent compaction requirements:
    - Preserve the user's latest hard constraints, corrections, and explicit decisions, especially anything that overrides earlier work.
    - Preserve active plan state when present: completed, in-progress, pending, blocked steps, and the reason for any blocked or deferred work.
    - Preserve unresolved operational risks: pending remote tasks or sub agents, failed retries, missing files, timeouts, unverified outputs, non-zero exits, and commands still running.
    - Preserve durable continuation anchors: branch names, commit hashes, task/job/submit ids, file paths, URLs, tool outputs, service ids, session ids, and thread ids.
    - Treat generated notes, summaries, and markdown status files as working notes unless they have been verified against tool results, current files, or user messages.

backend:
  type: local
  local:
    root: ${AIC_AGENT_SDK_WORKSPACE_ROOT}
  ai_infra:
    psm: pippit.sandbox.gateway
    biz_type: aic_agent_sdk
    biz_id_template: "user_{uid}"
    workdir_template: "/opt/tiger/workspace/{project_name}"
    action: SandboxToolCall

mcp:
  enabled: false
  request_timeout_ms: 300000
  region: ""
  servers: []

fornax:
  enabled: false
  ak: ""
  sk: ""
  region: ""
  http_timeout_ms: 10000

log:
  dir: ../runtime/dev/logs/worker_internal
  retention_days: 7
  enable_agent: true
  enable_console: false
