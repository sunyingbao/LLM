codecov:
  status: # 准入控制状态相关
    project:
      default: # 可以为任何值，代表了当前 paths 下的配置， 支持一个仓库内的多项目配置
        coverage_strategy: statement # branch or statement, default statement. not support diff coverage. Supported languages: node and c++
        minimum_coverage: 0% # 允许的覆盖率的最小值
        line_limit: 0  # 增量行数少于多少行时，默认置成功
        paths: # 支持根据不同的路径计算覆盖率。不添加该项时默认为全部路径
          - "!clients"
          - "!client"
          - "!dal"
          - "!constant"
          - "!dal"
          - "!kitex_gen"
          - "!mock"
          - "!script"
          - "!tool"
          - "!main.go"
          - "!handler.go"
          - "!tcc"
          - "!pkg/model"
          - "!example"
          - "!cmd"
          - "!mock"
          - "!skills"
        if_not_found: "success" # success  or error or warning  # 没有报告时 是否至成功
    diff:
      default:
        minimum_coverage: 45%
        threshold: 0%
        line_limit: 0
        paths:
          - "!clients"
          - "!client"
          - "!dal"
          - "!constant"
          - "!dal"
          - "!kitex_gen"
          - "!mock"
          - "!script"
          - "!tool"
          - "!main.go"
          - "!handler.go"
          - "!tcc"
          - "!pkg/model"
          - "!example"
          - "!cmd"
          - "!skills"
        if_not_found: success
